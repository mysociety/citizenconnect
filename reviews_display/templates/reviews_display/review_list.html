{% extends 'base.html' %}
{% load url from future %}

{% block title %}Reviews{% endblock %}

{% block bodyclasses %}review_list{% endblock %}

{% block content %}
<div class="header">
    <h1>Reviews</h1>
</div>


<ul>
  {% for review in object_list %}
    <li>

      <a href="{% url 'review-organisation-list' cobrand=cobrand.name code=review.site.code %}">
        {{ review.site.name }}
      </a>:

      <a href="{% url 'review-detail' cobrand=cobrand.name code=review.site.code api_posting_id=review.api_posting_id %}">
        {{ review.title }}
      </a>

    </li>
  {% endfor %}
</ul>


{% endblock %}
